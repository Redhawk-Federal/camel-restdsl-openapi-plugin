name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    # skip releases
    if: startsWith(github.ref, '[maven-release-plugin] prepare release') != true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: mvn clean verify
        run: ./mvnw -V --no-transfer-progress --batch-mode clean verify
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Check the pom version is a SNAPSHOT
        id: version
        run: |
          VERSION=$(./mvnw --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom version: ${VERSION}"
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "Final versions are published by the release workflow, skipping the snapshot deploy."
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy snapshot to GitHub Packages
        if: steps.version.outputs.snapshot == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -Dlicense.skip=true -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}